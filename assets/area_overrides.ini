; Area overrides: settings that change only in one part of the game.
;
; Each [section] is one area, named however you like:
;
;   map = m13_02_00_00                 the map (the F4 Lights tab shows the current one)
;   box = x y z x y z                  optional: two opposite corners in the world. Without a box, the whole map.
;   proxy.<Section>.<Key> = value      any key of remix-comp-proxy.ini, by its [Section] and Key
;   rtx.<option> = value               any Remix option, as written in rtx.conf
;
; On entering the area its values apply; on leaving, each goes back to what it was: remix-comp-proxy.ini for proxy keys,
; user.conf or rtx.conf for rtx options, or Remix's default if neither sets it. Areas that overlap all apply; where they
; set the same key, the one lower in this file wins.
;
; This file is watched, so saving it applies at once, in the game and in the lookdev host. What happened goes to the log
; (rtx_comp\console.log, console_host.log in the host), lines marked [AreaOverrides], including anything refused.
;
; Saving from the F4 menu inside an area leaves that area's proxy keys out of remix-comp-proxy.ini. Saving Remix's own
; settings (Alt+X) inside an area can write its rtx options into user.conf.
;
; Position in the box is the player's: x, height, depth, as in the lights files. Moving between proxy overrides re-reads
; the proxy's INI, so settings changed in the F4 menu but not yet saved are lost at that moment.

[Great Hollow]
; The whole shaft and tunnel, not Ash Lake, which shares the map.
map = m13_02_00_00
box = -370 -405 60 -290 -120 170
; The head light (range 18 m) is much of what lights the tunnel in the game. Elsewhere it stays at a third of the game's
; strength: at full strength it overbrightened Painted World's close-up ground. 3.14 is the game's strength.
proxy.PlayerLight.FalloffIntensity = 3.14

[Duke's Archives]
map = m17_00_00_00
; The game's ambient here is high (1.6 to 1.9 in gamma) because its shaders scale it by a dark lightmap. Remix gives it in full to any ray that
; leaves the map, and this map is not sealed where the player cannot go: the skirt round the tower's foot at y 230 sees out below the floor (white
; bars, lit gears, a yellow panel behind the bars). Rays that leave take a tenth; the rooms have real lights.
rtx.ds1Ambient.gain = 0.1

[The Depths]
map = m10_00_00_00
; The slime. Its look in the game is a reflection of a cube map; here it reflects the dark sewer. A stronger, sharper reflection than
; the game's c87 of 3 measures closest to vanilla on frame_20261030_083433 and 091928, and shows about twice the relief of the default.
rtx.ds1Swamp.envScale = 6
rtx.ds1Swamp.roughness = 0.45

[Undead Asylum]
map = m18_01_00_00
; The game bakes this map's sun into its lightmaps and its probes hold none, so Remix gets no sun colour. Direction: the game's own
; shadow direction here (c175). Colour: chosen on frame_20261103_230232, 230359 and 230405; 0.25 adds little on the sunlit floors
; and overbrightens the rest of the frame.
proxy.Sun.Colour = 0.15,0.15,0.15
proxy.Sun.Direction = -0.17,-0.94,-0.30
