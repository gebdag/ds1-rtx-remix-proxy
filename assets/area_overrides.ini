[Tomb of the Giants, Ash Lake view]
map = m13_01_00_00
box = 20 -250 -55 110 -205 30
; The user's choice (2026-11-09): engine culling off here, no light blockers, radius 120. Culling made the light pop: the game's ambient swings about 20x with what is drawn (0.04 facing the teal view, up to 0.97 facing the cave).
; Held at one faint teal instead, as if the distant Ash Lake lit the rockway. Player position box.
