[Ash Lake]
map = m13_02_00_00
; The lake and its beaches only: the Great Hollow above shares the map and has its own set (c86 1.59). Bonfires at y -408 and -414, the highest sand about -398.
box = -2000 -450 -2000 2000 -395 2000
; The lake's main light set. The Hydra's end of the lake carries a far brighter one (c86 2.77); with it in view the two swapped as the area's ambient,
; and the sky and sun jumped for seconds at a time (frames 8594 to 9630 of the 2026-11-09 run's [LookWatch] log).
proxy.Ambient.PreferScale = 1.059
; The Everlasting Dragon's end has a haze set that takes most of a surface's light (c105 = 1/255; the game answers with c86 2.76 and bright lightmaps), which left its sand black and
; deaf to lights. Only that set is held up; the rest of the lake is left as the game has it. Its lights are in lights\m13_02_00_00.custom.txt.
rtx.ds1Haze.minSurfaceShare = 1
; The water's reflection level, per channel, on top of the game's own tint and weight. The game's reflection is a small image
; sampled far off its mirror point, so near the horizon its water shows the sky where a traced ray meets the dark far shore:
; rows under the horizon read (0, 25, 35) to (0, 12, 22) in the game against (2, 16, 19) to (1, 8, 11) (frame_20261111_013729).
proxy.FFP.WaterReflectionScale = 2.2,2.2,3.2

