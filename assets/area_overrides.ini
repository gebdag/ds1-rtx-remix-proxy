box = -20 -325 -50 177 -205 146
; The probe's six sides as they are: it is brightest from one side and from above and half that from the other side.
proxy.Ambient.ProbeFaces = 1
; The game draws the characters at half their texture's colour (c100 = 0.5), which Remix leaves out: 0.5 in the game's gamma is
; 0.22 of the light. On the ambient, so it also takes the specular down, which the game does not (its sheen comes from its own
; reflection cube, which neither way shows). Tried instead: c100 in the albedo alone. The King came out 1.6 times the game's
; and greyer (this way 1.3), the player 0.8 (this way 0.7).
rtx.ds1Ambient.gain = 0.22
; With the box gone the camera's rays that miss show the sky, and the Abyss draws none: they showed the last sky drawn, New
