; Area overrides: settings that change only in one part of the game.
;
; Each [section] is one area, named however you like:
;
;   map = m13_02_00_00                 the map (the F4 Lights tab shows the current one)
;   box = x y z x y z                  optional: two opposite corners in the world. Without a box, the whole map.
;   yaw = 45                           optional: the box turned this many degrees about the vertical through its centre
;                                      (for rooms that do not run along the map's axes)
;   proxy.<Section>.<Key> = value      any key of remix-comp-proxy.ini, by its [Section] and Key
;   rtx.<option> = value               any Remix option, as written in rtx.conf
;   lights = <start of a name>         optional: this map's custom lights whose names start with it are there only
;                                      while the player is in this area (F4 > Lights > Custom lights shows which)
;
; On entering the area its values apply; on leaving, each goes back to what it was: remix-comp-proxy.ini for proxy keys,
; user.conf or rtx.conf for rtx options, or Remix's default if neither sets it. Areas that overlap all apply; where they
; set the same key, the one lower in this file wins.
;
; This file is watched, so saving it applies at once, in the game and in the lookdev host. What happened goes to the log
; (rtx_comp\console.log, console_host.log in the host), lines marked [AreaOverrides], including anything refused.
;
; Saving from the F4 menu inside an area leaves that area's proxy keys out of remix-comp-proxy.ini. Saving Remix's own
; settings (Alt+X) inside an area can write its rtx options into user.conf.
;
; Position in the box is the player's: x, height, depth, as in the lights files. Moving between proxy overrides re-reads
; the proxy's INI, so settings changed in the F4 menu but not yet saved are lost at that moment.

[Great Hollow]
