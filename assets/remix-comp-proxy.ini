; remix-comp-proxy configuration (d3d9.dll proxy)
; Adapted from xoxor4d/remix-comp-base by gabdeg for Dark Souls: Prepare to Die Edition

[Remix]
Enabled=1
DLLName=d3d9_remix.dll

; ============================================================
; DLL/ASI Chain Loading
;
; PreLoad:  Loaded during DllMain, before the d3d9 chain.
; PostLoad: Loaded after the game window is found.
;
; Semicolon-separated. Paths relative to the game directory.
; Supports .dll and .asi files.
;
; Example: PreLoad=patch.dll;fix.asi
; ============================================================
[Chain]
PreLoad=
PostLoad=

; ============================================================
; FFP Conversion Settings
;
; Set Enabled=0 to disable FFP conversion entirely (passthrough mode).
; Useful for tracing or non-FFP mods.
; ============================================================
[FFP]
Enabled=1

; AutoEnable: FFP starts OFF and auto-enables when 3D world draws are detected.
; Auto-disables when returning to menus (few/no eligible draws). Avoids crashes
; during character select where FFP conversion is unsafe.
AutoEnable=1

; AutoEnableThreshold: Minimum FFP-eligible draws/frame to count as "in-game".
AutoEnableThreshold=50

; AutoEnableFrames: Consecutive frames above/below threshold before toggling.
AutoEnableFrames=5

; Texture phase scrubber source stage.
; The F4 menu slider updates this live and copies the selected stage to FFP stage 0.
AlbedoStage=0

; DedupPassMode: DS1 reuses the same geometry key across real material phases.
; Keep this OFF unless you are explicitly debugging pass families.
; 0=off, 1=keep first, 2=keep last, 3=keep all. Adjustable live via F4.
DedupPassMode=0

; ShowDedupUI: Show dedup radio buttons in F4 menu (for debugging).
ShowDedupUI=0

; TexFilter: DS1 shares helper/env textures across real passes, so global filtering
; can hide valid surviving draws. Keep this OFF unless debugging.
TexFilter=0

; TexFilterThreshold: Minimum peak draws/frame for a texture to be filtered.
; Higher = fewer textures filtered. Adjustable live via F4 slider (10-200).
TexFilterThreshold=80

; ExpandSkinnedUV: Expand SHORT texcoords to FLOAT2 in skinned vertex buffers.
; Disable to test whether vertex corruption (planes to infinity) is caused by
; the expansion or by Remix's handling of bind-pose skinned geometry.
ExpandSkinnedUV=1

; SkipPostFX: Suppress the game's built-in post-processing (bloom, DoF, HDR tonemap).
; These are fullscreen quad draws that interfere with RTX Remix's own post-processing.
SkipPostFX=1

SuppressAuxPasses=1

; TextureLayerBlend: DS1 texture blending/compositing via Remix decal blending.
; Fire and forget ??? no texture hash lists or manual marking needed. Covers:
; 1. Two-layer [M] materials (e.g. grass blended over dirt): base diffuse on PS
;    stage 0, overlay diffuse on stage 3, both UV pairs in one SHORT4 TEXCOORD0,
;    lerped by painted vertex-color alpha. The base renders as a normal opaque
;    FFP draw; the overlay is re-drawn as a coplanar alpha-blended pass from its
;    own vertex buffer (second UV set, vertex alpha as opacity). Only draws whose
;    pixel shader actually declares sampler s3 (the two-layer "Mul" shaders) get
;    the overlay pass ??? DS1 leaves stale textures bound on s3+ across material
;    changes, so the binding alone is not trusted.
; 2. The game's own alpha-blended edge-fade draws (terrain transition strips
;    rendered with SRCALPHA/INVSRCALPHA over the base ground).
; Both kinds of draws carry a D3DTSS_CONSTANT marker; the custom RTX Remix
; runtime (rtx.fixedFunctionDecalMarkerEnabled=True in rtx.conf) classifies
; marked draws as static decals and composites them onto the surface beneath via
; decal material blending ??? works on floors and walls alike.
; Toggle live with F4 > Dev > Texture Layer Blend.
TextureLayerBlend=1

; WaterSurface: convert water-surface draws (FRPG_Water_Env*/Reflect*,
; FRPG_WWS_Dif*) to FFP. Without this, water is absent from the path-traced
; scene: the WWS decl has no NORMAL (HUD-passthrough), Env water binds no
; stage-0 diffuse (NULL-albedo skip), Reflect water binds the per-frame
; reflection RT. Water draws are forced opaque with a static albedo (first
; non-RT texture, else a solid blue fallback) so Remix gets a stable texture
; hash to remap with a translucent water material.
WaterSurface=1

; WaterFallbackAlbedo: albedo policy for Env/Reflect water (which has no real
; diffuse texture). 1 = bind the generated solid-color fallback texture (its
; fresh hash cannot collide with rtx.conf ignore/hide texture lists).
; 0 = bind the first static texture on s1-s7 (the scroll normal maps) instead;
; only useful for diagnosing texture-hash filtering, since those hashes may be
; in rtx.conf ignoreTextures/hideInstanceTextures, hiding the water instance.
WaterFallbackAlbedo=1

; ZWriteQueryPerDraw: Query D3DRS_ZWRITEENABLE from the device on every draw
; (one extra bridge round-trip per draw, even with FFP off). Catches changes
; applied via StateBlock::Apply that the SetRenderState intercept can't see.
; 0 = use the passively tracked value instead (cheaper, slightly less robust
; prepass detection for SuppressAuxPasses).
ZWriteQueryPerDraw=1

; ============================================================
; Per-Pass Post-FX Control
;
; Comma-separated list of pass indices to skip.
; Empty = skip all passes. Define specific passes to skip only those.
; Observe pass indices in F4 > Post-FX tab.
; ============================================================
[PostFX]
SkipPasses=

; ============================================================
; Skinning (OFF by default)
;
; Only enable after rigid FFP geometry works correctly.
; See documentation for skinning setup workflow.
; ============================================================
[Skinning]
Enabled=0

; ============================================================
; Cheats
; ============================================================
[Cheats]
GodMode=0

; ============================================================
; Diagnostic Logging
;
; AutoCapture: Writes rtx_comp\diagnostics.log after DelayMs milliseconds.
; Logs LogFrames frames of draw call data for debugging.
; The delay ensures the game is in-game with real geometry.
;
; On-demand capture is always available from the ImGui overlay
; (F4 -> Diagnostics tab) regardless of AutoCapture setting.
;
; Log categories control what data is captured.
; All categories default to ON. Disable to reduce log noise.
; ============================================================
[Diagnostics]
Enabled=1
AutoCapture=1
DelayMs=50000
LogFrames=3
LogDrawCalls=1
LogVSConstants=1
LogVertexData=1
LogDeclarations=1
LogTextures=1
LogPresentInfo=1

; ============================================================
; Frame Tracer
;
; Integrated D3D9 call tracer. Captures all API calls to JSONL
; for offline analysis with:
;   python -m graphics.directx.dx9.tracer analyze <file.jsonl> --summary
;
; FFP is automatically disabled during capture to record
; the game's unmodified calls.
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures

; ============================================================
; Intro Skip
;
; The game's title step never opens its logo dialog, so the
; logos are not shown and the title follows straight away.
; ============================================================
[IntroSkip]
Enabled=1

; ============================================================
; Engine Frustum Culling
;
; EnableFrustumCulling=1 mirrors stock game behavior exactly.
; EnableFrustumCulling=0 with FrustumRelaxationRadius=0 disables world frustum
;   culling entirely (everything the region tree offers is drawn — expensive).
; EnableFrustumCulling=0 with FrustumRelaxationRadius>0 keeps world bounds
;   within that many units of the camera visible (measured from the tested
;   frustum's own apex, so it works behind the player and for every camera).
; Adjustable live via F4.
; ============================================================
[Culling]
EnableFrustumCulling=1
FrustumRelaxationRadius=120

; ============================================================
; FPS Unlock
;
; Patches the game's animation timestep and removes the 30fps
; vsync lock, allowing the game to run at higher frame rates.
; TargetFPS is adjustable live via F4 slider (30-240).
; ============================================================
[FPSUnlock]
Enabled=1
TargetFPS=60

; ============================================================
; Game Lights
;
; Harvests the engine's own live point lights (KPointLightMan: map lights,
; torches, lanterns, FX/item lights) each frame via the entities' own
; GetLightParams accessor and mirrors them as RTX Remix lights.
; Tune scales live from the F4 Lights tab.
; ============================================================
[Lights]
Enabled=1

; IntensityScale: user multiplier on the harvested radiance. 1.0 is the tuned
; default; 8.0 restores the pre-2026-09-02 brightness (the radiance model folds the
; engine's dwindle-end distance in as an inverse-square term, which landed a stock
; torch near 32 instead of near 1).
IntensityScale=1.0
RadiusScale=1.0

; ResolveEntityParams: resolve the DLRF handle on each KPointLightMan slot and read
; the light through its own GetLightParams (vtable +0x30) instead of only the slot's
; POINT_LIGHT_BANK row.
;
; DS1 has two kinds of point light. Bank lights come from MSB Light events and carry
; a row pointer on the slot. Direct lights - the class the SFX system creates for
; flame effects, plus item and spell lights - zero that pointer and keep their colour
; and falloff on the entity, so they are invisible without this.
;
; This is what Blighttown needs: m14_00_00_00.msb places ZERO Light events, so every
; one of its 99 torches is a Direct light. Same for Tomb of the Giants and Duke's
; Archives. Set to 0 to fall back to MSB map lights only.
ResolveEntityParams=1

; SynthesizedLights: inject the stand-in point lights in rtx_comp\lights\<map>.txt.
;
; Some maps place flame effects but no MSB Light events, AND their flame effect declares
; no light node -- measured in Blighttown: 99 torch effects, and the engine holds exactly
; two point lights there, both belonging to the bonfire. Nothing can be harvested, so
; these tables stand in: one line per shipped flame placement, coloured by that map's own
; POINT_LIGHT_BANK row. Regenerate with scripts/gen_map_lights.py; edit the deployed
; tables freely and press "Reload Light Table" in F4 > Lights.
SynthesizedLights=1

; ============================================================
; HUD / UI
;
; MarkUiDraws: Tag every EzMenu HUD/menu draw (identified structurally by its
; draw-call signature — covers HUD, menus, subtitles, fades, loading screens
; and the movie surface) with the stage-0 D3DTSS_CONSTANT UI marker. The
; custom Remix runtime (rtx.uiMarkerEnabled = True in rtx.conf) classifies
; marked draws as UI and rasterizes them on top of the path-traced scene —
; no rtx.uiTextures hash lists needed.
; ============================================================
[Hud]
MarkUiDraws=1

; ============================================================
; Resolution Override
;
; Dark Souls PTDE internally renders at 1024x720 regardless of
; the in-game resolution setting. This intercepts all resource
; creation at 1024x720 and replaces it with the specified size.
;
; RenderWidth/RenderHeight: Internal rendering resolution
;   (render targets, depth buffers, textures).
;   0 = disabled (use game's default 1024x720).
;
; PresentWidth/PresentHeight: Backbuffer/present resolution.
;   0 = same as RenderWidth/RenderHeight.
;   Only set differently if you want a different display size.
;
; Example for 1920x1080:
;   RenderWidth=1920
;   RenderHeight=1080
; ============================================================
[Resolution]
RenderWidth=1920
RenderHeight=1080
PresentWidth=1920
PresentHeight=1080

; ============================================================
; Perf — schedule-level render kill switches (F4 -> Perf tab)
;
; Every key writes one of DS1's own scheduler flags (the internal GAME REND
; debug menu bytes), so disabled work is never planned, culled, or submitted —
; the engine behaves as if it had a real graphics option for it. All keys
; default to 1 (stock rendering); set to 0 to kill that part of the frame.
; The old [Effects] section is gone: its orchestrator NOP patches suppressed
; dispatch inside the retained draw plan and made performance WORSE.
; ============================================================
[Perf]
; ALL KEYS SHIP AT 1 (stock rendering). These are engine-level kill switches
; and they are NOT verified in-game — enabling them in bulk crashed the game
; on the character-select screen (2026-08-02). Turn them on ONE AT A TIME from
; the F4 -> Perf tab, which applies them live and logs each kill, and only then
; write the ones that survive into this file.
;
; Suggested order, safest first (per analysis/ghidra_renderpaths.md §7):
;   ShadowMapSize=512  ->  ZPrePass=0  ->  ShadowDepthStage=0 + ShadowTexEdgeStage=0
;   ->  TexEdgeStage=0 / DepthTexEdgeStage=0  ->  BoundingRegionStage=0
;   ->  LightShafts=0 + LightShaftFilter=0  ->  the post-FX filters
;   ->  WaterReflection=0 (new 2-byte code patch, least proven)
;
; Draw groups — which entity classes are rendered at all
Map=1
Objects=1
Characters=1
Sfx=1
Cutscenes=1
LightShafts=1
; Draw stages — which passes the scheduled entities are drawn in
ZPrePass=1
DepthNormalStage=1
DepthTexEdgeStage=1
NormalStage=1
BoundingRegionStage=1
TexEdgeStage=1
WaterMaskStage=1
WaterStage=1
TransStage=1
ShadowDepthStage=1
ShadowTexEdgeStage=1
; Pass / effect schedulers.
; WaterReflection=0 stops the mirrored-scene capture that hijacks Remix's
; camera (2-byte code patch on the reflect stage-mask fold).
ShadowCascades=1
WaterReflection=1
OffscreenSfx=1
MSAA=1
EnvMapCapture=1
; Post-processing filters — killed with the engine's own SetEnable plan token
; on the ImageFilter node, re-emitted per frame. Kill order matters:
; LightShaftFilter/Bloom source the ToneMap output, so ToneMap stays on while
; either is on. DownSample/Combine produce the presented image — keep on.
DoF=1
Bloom=1
ToneMap=1
LightShaftFilter=1
CameraBlur=1
PostFxDownsample=1
Combine=1
; Shadow atlas edge length. 0 = stock (2048). Engine-supported range 512-2048;
; takes effect when the atlas is recreated (area load). 512 = 16x less shadow
; rasterization and is the single safest performance cut.
ShadowMapSize=0

; ============================================================
; Benchmark
;
; Automated option-cost sweep - start from F4 > Bench (or F7).
; Toggles all options off, measures a baseline, then measures each option
; individually (sub-options on top of their parent feature), restores your
; settings and writes rtx_comp\benchmark_<timestamp>.txt.
;
; SettleFrames: frames to wait after switching options before measuring.
; MeasureFrames: frames measured per phase.
; ============================================================
[Benchmark]
SettleFrames=90
MeasureFrames=240
